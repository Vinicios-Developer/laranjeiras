<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Copa Laranjeiras</title><link rel="stylesheet" href="/styles-v2.css"></head><body class="auth-page"><div class="auth-card"><a class="brand" href="/"><span class="brand-mark">CL</span><span><strong>COPA</strong><small>LARANJEIRAS</small></span></a><p class="eyebrow">Área restrita</p><h1>Criar conta de organização</h1><p class="muted">Cadastre o primeiro acesso ao painel administrativo.</p><form method="post" action="/cadastro"><label>Nome<input name="name" required autocomplete="name"></label><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="password" type="password" minlength="8" required autocomplete="new-password"><span class="hint">Use pelo menos 8 caracteres.</span></label><button class="button button-primary full">Criar conta →</button></form><p class="form-note">Já tenho uma conta. <a href="/login">Entrar</a></p><p class="error">{{error}}</p></div></body></html>
